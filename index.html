<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

    <style>
        body {

    <main>

        ما در زمینه بازرگانی، فروش و توزیع محصولات فعالیت می‌کنیم.
        هدف ما ایجاد همکاری پایدار و ارزش‌آفرینی برای شرکای تجاری است.

<footer>
